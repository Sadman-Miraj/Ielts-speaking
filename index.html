<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS Speaking Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Schibsted+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one desk. A single narrow column; the examiner's question is the only raised sheet,
     the candidate's answer is ruled paper below it, controls sit flat on the desk. */
  --paper:#e9ecf1; --sheet:#fbfbfd; --ink:#141a2e; --muted:#586177; --line:#cfd5e0;
  --accent:#2340c8; --accent-ink:#ffffff; --accent-soft:#dfe5fb;
  --live:#cf3320; --ok:#1b7a4b; --warn:#a56000; --zone:rgba(27,122,75,.18);
  --display:'Literata',Georgia,'Times New Roman',serif;
  --body:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Spline Sans Mono',ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0e1220; --sheet:#171c2d; --ink:#e7eaf3; --muted:#98a1b7; --line:#2b3249;
    --accent:#93a5ff; --accent-ink:#0e1220; --accent-soft:#222b4d;
    --live:#ff7566; --ok:#52c690; --warn:#efb04c; --zone:rgba(82,198,144,.2);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1220; --sheet:#171c2d; --ink:#e7eaf3; --muted:#98a1b7; --line:#2b3249;
  --accent:#93a5ff; --accent-ink:#0e1220; --accent-soft:#222b4d;
  --live:#ff7566; --ok:#52c690; --warn:#efb04c; --zone:rgba(82,198,144,.2);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
h1,h2,h3{text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 64px;display:flex;flex-direction:column;gap:28px}
.narrow{max-width:760px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:9px 14px;font-weight:500;cursor:pointer;min-height:40px;text-align:center}
.btn:hover{border-color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:default;border-color:var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.live{background:var(--live);border-color:var(--live);color:#fff}
.btn.big{padding:14px 22px;font-size:17px;min-height:54px}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);padding:9px 8px}
.btn.quiet:hover{color:var(--ink)}
kbd{font-family:var(--mono);font-size:12px;border:1px solid currentColor;border-radius:4px;padding:1px 6px;opacity:.75}

/* home */
.mast{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.mast h1{font-family:var(--display);font-weight:600;font-size:clamp(40px,7vw,68px);line-height:1;letter-spacing:-.02em}
.mast h1 i{font-weight:400;color:var(--accent)}
.lede{max-width:56ch;font-size:18px;color:var(--muted)}
.home-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:780px){.home-grid{grid-template-columns:1fr}}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 0 var(--line),0 14px 30px -22px rgba(20,26,46,.45)}
.start{padding:24px;display:flex;flex-direction:column;gap:20px}
.start h2{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.2}
.plan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden}
.plan li{padding:12px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line);min-width:0}
.plan li:first-child{border-left:0}
.plan b{font-size:14px}
.plan .num{font-size:13px;color:var(--muted)}
.plan span{font-size:13px;color:var(--muted)}
@media (max-width:440px){.plan{grid-template-columns:1fr}.plan li{border-left:0;border-top:1px solid var(--line)}.plan li:first-child{border-top:0}}
.opts{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;font-size:14px}
.opts label{display:inline-flex;gap:8px;align-items:center}
.opts select{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.check{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:16px;font-size:14px}
.check li{display:grid;grid-template-columns:14px 1fr;gap:8px;align-items:baseline}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;transform:translateY(-1px)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}
.sets{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:15px;font-weight:700;letter-spacing:.01em}
.setlist{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;text-align:left;width:100%;background:transparent;border:1px solid var(--line);border-radius:8px;padding:11px 14px;cursor:pointer}
.set:hover{border-color:var(--ink)}
.set[aria-pressed="true"]{background:var(--sheet);border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.set b{font-weight:600}
.set .meta{grid-column:1;font-size:13px;color:var(--muted)}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.tag.mine{color:var(--accent);border-color:var(--accent)}
.sublabel{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.history{display:flex;flex-direction:column;gap:12px}
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row .when{font-size:13px;color:var(--muted);min-width:92px}
.row .open{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:500}
.row .open:hover{color:var(--accent)}
@media (max-width:560px){.row{grid-template-columns:1fr auto}.row .when{grid-column:1/-1}}
.pill{font-family:var(--mono);font-size:13px;border-radius:999px;padding:3px 10px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.pill.none{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:8px;padding:16px;color:var(--muted);font-size:14px}

/* editor */
.editor{padding:24px;display:flex;flex-direction:column;gap:18px}
.editor h2{font-family:var(--display);font-size:28px;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.field .hint{font-size:13px;color:var(--muted)}
.field input,.field textarea{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.field textarea{min-height:130px;resize:vertical;line-height:1.5}
.aidraft{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--accent-soft);border-radius:8px;padding:12px}
.aidraft input{flex:1 1 220px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.err{color:var(--live);font-size:14px}

/* test room */
.bar{display:grid;grid-template-columns:1fr auto;gap:12px 20px;align-items:center}
.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.parts li{border-top:3px solid var(--line);padding-top:6px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;min-width:0}
.parts li b{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.parts li.done{border-color:var(--ink);color:var(--ink)}
.parts li.on{border-color:var(--accent);color:var(--ink)}
.parts li.on b{color:var(--accent)}
.clock{text-align:right;display:flex;flex-direction:column;line-height:1.1}
.clock b{font-family:var(--mono);font-weight:500;font-size:24px;font-variant-numeric:tabular-nums}
.qsheet{padding:28px 28px 24px;display:flex;flex-direction:column;gap:16px}
.question{font-family:var(--display);font-size:clamp(24px,4.4vw,36px);line-height:1.22;letter-spacing:-.01em;text-wrap:balance}
.status{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);min-height:22px}
.status .dot{background:var(--accent)}
.status.speaking .dot{animation:pulse 1.1s ease-in-out infinite}
.cue{border:1.5px solid var(--ink);border-radius:4px;padding:20px 22px;display:flex;flex-direction:column;gap:10px;background:var(--sheet)}
.cue .eyebrow{color:var(--ink)}
.cue h3{font-family:var(--display);font-weight:600;font-size:clamp(22px,3.6vw,28px);line-height:1.25}
.cue ul{display:flex;flex-direction:column;gap:4px;padding-left:18px;list-style:disc}
.cue .say{font-size:14px;color:var(--muted)}
.prep{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.prep .count{font-family:var(--mono);font-size:44px;line-height:1;font-variant-numeric:tabular-nums;min-width:120px}
@media (max-width:520px){.prep{grid-template-columns:1fr}}
.notes{width:100%;min-height:96px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical;line-height:1.5}
.notes-ro{white-space:pre-wrap;font-size:14px;border-left:3px solid var(--line);padding-left:12px;color:var(--muted)}
.answer{display:flex;flex-direction:column;gap:10px}
.answer-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.rec{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.rec .dot{background:var(--live);animation:pulse 1.1s ease-in-out infinite}
.rec.wait .dot{background:var(--muted);animation:none}
.atime{font-family:var(--mono);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.meter{position:relative;height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;background:var(--zone);border-left:1px solid var(--ok);border-right:1px solid var(--ok)}
.meter .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink);border-radius:999px;transition:width .2s linear}
.meter.in .fill{background:var(--ok)} .meter.over .fill{background:var(--warn)}
.live{min-height:128px;max-height:260px;overflow:auto;padding:0 14px;border:1px solid var(--line);border-radius:8px;font-size:17px;line-height:32px;
  background:linear-gradient(var(--sheet),var(--sheet)) padding-box;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--line) 31px,var(--line) 32px);background-color:var(--sheet);background-attachment:local}
.live .partial{color:var(--muted)}
.live .ph{color:var(--muted);font-style:italic}
textarea.live{width:100%;resize:vertical;display:block}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.controls .spacer{flex:1 1 0}
.msg{font-size:14px;color:var(--warn)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* results */
.res-head{display:flex;flex-direction:column;gap:6px}
.res-head h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,5vw,44px);line-height:1.1}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tiles li{padding:14px 16px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.tiles li:first-child{border-left:0}
.tiles b{font-family:var(--mono);font-weight:500;font-size:24px;font-variant-numeric:tabular-nums}
.tiles span{font-size:13px;color:var(--muted)}
@media (max-width:600px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles li:nth-child(3){border-left:0}.tiles li:nth-child(n+3){border-top:1px solid var(--line)}}
.fb{padding:24px;display:flex;flex-direction:column;gap:18px}
.fb h2{font-size:15px;font-weight:700}
.bandrow{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start}
@media (max-width:600px){.bandrow{grid-template-columns:1fr}}
.overall{display:flex;flex-direction:column;gap:2px;padding-right:24px;border-right:1px solid var(--line)}
@media (max-width:600px){.overall{border-right:0;padding-right:0}}
.overall b{font-family:var(--display);font-weight:600;font-size:84px;line-height:.95;letter-spacing:-.03em;color:var(--accent)}
.crit{display:flex;flex-direction:column;gap:14px}
.crit li{display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.crit .name{font-weight:600}
.crit .b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.crit .track{grid-column:1/-1;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.crit .track i{display:block;height:100%;background:var(--accent);border-radius:999px}
.crit p{grid-column:1/-1;font-size:14px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:600px){.two{grid-template-columns:1fr}}
.two h3{font-size:13px;font-family:var(--mono);font-weight:500;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.two ul{display:flex;flex-direction:column;gap:6px;padding-left:18px;list-style:disc;font-size:15px}
.good h3{color:var(--ok)} .next h3{color:var(--warn)}
.answers{display:flex;flex-direction:column;gap:14px}
.ans{border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;background:var(--sheet)}
.ans .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.ans h3{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.3}
.ans .said{font-size:16px;white-space:pre-wrap}
.ans .said.none{color:var(--muted);font-style:italic}
.note{border-left:3px solid var(--accent);padding-left:12px;font-size:15px}
.fix{font-size:14px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.fix dt{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.fix dd{margin:0}
.fix .was{text-decoration:line-through;text-decoration-color:var(--live);color:var(--muted)}
.fix .why{color:var(--muted)}
.box{background:var(--paper);border-radius:8px;padding:12px 14px;font-size:15px;white-space:pre-wrap}
.box .sublabel{margin:0 0 4px;display:block}

/* standalone additions */
audio{width:100%;height:38px;display:block}
.settings{border-top:1px solid var(--line);padding-top:14px;font-size:14px}
.settings summary{cursor:pointer;font-weight:600;width:max-content}
.setgrid{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.field select{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.keyrow{display:flex;gap:8px;flex-wrap:wrap}
.keyrow input{flex:1 1 240px;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
"use strict";
/* IELTS Speaking Room: one self-contained page. Everything runs in the browser. */
const BUILTIN=[
 {id:"b1",builtin:true,name:"Hometown and a journey",theme:"travel and transport",
  part1:[{topic:"Your hometown",questions:["Where is your hometown?","What do you like most about living there?","Has your hometown changed much since you were a child?"]},
         {topic:"Your daily routine",questions:["What does a typical weekday look like for you?","Which part of the day do you enjoy most?","Would you like to change anything about your routine?"]},
         {topic:"The weather",questions:["What is the weather usually like where you live?","Does the weather ever affect your mood?","Which season do you prefer, and why?"]}],
  cue:{topic:"Describe a journey you remember well.",bullets:["where you went","who you travelled with","what happened on the way","and explain why you remember this journey so well"]},
  part3:["Why do some people prefer travelling by train rather than by plane?","How has tourism changed the places people visit in your country?","Do you think people travel more now than in the past? Why?","What can governments do to make public transport more attractive?","Some people say travel broadens the mind. To what extent do you agree?"]},
 {id:"b2",builtin:true,name:"Study and a teacher",theme:"education and teaching",
  part1:[{topic:"Work or study",questions:["Do you work, or are you a student?","Why did you choose that subject or job?","What do you find most difficult about it?"]},
         {topic:"Reading",questions:["How often do you read for pleasure?","Do you prefer paper books or reading on a screen?","Did you read much as a child?"]},
         {topic:"Mornings",questions:["Are you a morning person?","What do you usually have for breakfast?","Is it easy for you to get up early?"]}],
  cue:{topic:"Describe a teacher or mentor who had an influence on you.",bullets:["who this person was","how you knew them","what they taught you","and explain why they influenced you so much"]},
  part3:["What qualities make someone a good teacher?","Is it better to learn from a teacher or to teach yourself online?","How has technology changed the way students learn?","Should schools focus more on practical skills than on academic subjects?","Do you think teachers are respected enough in society today?"]},
 {id:"b3",builtin:true,name:"Technology and a useful device",theme:"technology in everyday life",
  part1:[{topic:"Mobile phones",questions:["How often do you use your mobile phone?","What do you mostly use it for?","Could you live without it for a week?"]},
         {topic:"Social media",questions:["Which social media apps do you use?","Do you think you spend too much time online?","Have you ever taken a break from social media?"]},
         {topic:"Photos",questions:["Do you take many photos?","Do you prefer taking photos of people or of places?","What do you do with the photos you take?"]}],
  cue:{topic:"Describe a piece of technology, other than a phone, that you find useful.",bullets:["what it is","when you got it","how often you use it","and explain why it is so useful to you"]},
  part3:["How has technology changed the way people communicate?","Are older people at a disadvantage in a digital world?","Do you think children should learn to code at school?","What are the risks of depending too much on technology?","Will artificial intelligence replace many jobs in the future?"]},
 {id:"b4",builtin:true,name:"Food, friends and a special meal",theme:"food and eating habits",
  part1:[{topic:"Food",questions:["What kind of food do you like most?","Do you often cook at home?","Is there any food you disliked as a child but enjoy now?"]},
         {topic:"Friends",questions:["Do you prefer having a few close friends or many friends?","How do you usually keep in touch with your friends?","What do you like doing together?"]},
         {topic:"Weekends",questions:["What do you usually do at weekends?","Do you prefer to plan your weekend or decide on the day?","Was your last weekend a typical one?"]}],
  cue:{topic:"Describe a special meal you shared with other people.",bullets:["when and where it was","who was there","what you ate","and explain why this meal was special"]},
  part3:["How have eating habits changed in your country in recent years?","Why do many people choose fast food even though they know it is unhealthy?","Should governments tax unhealthy food?","Is it important for families to eat together?","Do you think traditional dishes will disappear in the future?"]},
 {id:"b5",builtin:true,name:"City life and a place to relax",theme:"cities and public spaces",
  part1:[{topic:"Your home",questions:["Do you live in a house or a flat?","Which room do you spend the most time in?","What would you change about your home?"]},
         {topic:"Getting around",questions:["How do you usually get around your city?","Is traffic a problem where you live?","Do you ever walk or cycle instead?"]},
         {topic:"Noise",questions:["Do you mind noise when you are working or studying?","Where do you go when you want quiet?","Is your neighbourhood noisy?"]}],
  cue:{topic:"Describe a place where you go to relax.",bullets:["where it is","how often you go there","what you do there","and explain why it helps you relax"]},
  part3:["Why do so many people move from the countryside to big cities?","What problems does rapid urban growth cause?","How important are parks and green spaces in a city?","Should cars be banned from city centres?","What will cities look like fifty years from now?"]},
 {id:"b6",builtin:true,name:"Free time and a hard decision",theme:"decisions and success",
  part1:[{topic:"Free time",questions:["What do you do in your free time?","Have your hobbies changed since you were younger?","Is there a new hobby you would like to try?"]},
         {topic:"Shopping",questions:["Do you enjoy shopping?","Do you prefer shopping online or in shops?","What was the last thing you bought for yourself?"]},
         {topic:"Sleep",questions:["How many hours do you usually sleep?","Do you ever take a nap during the day?","What helps you sleep well?"]}],
  cue:{topic:"Describe a difficult decision you had to make.",bullets:["what the decision was","when you made it","what options you had","and explain how you felt about your choice afterwards"]},
  part3:["Do young people today have more choices than their parents did?","Is it better to make important decisions quickly or slowly?","Who should people ask for advice about their career?","How do you define success?","Does money have too much influence on the decisions people make?"]}
];

/* ---------- what this browser can do ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
const canRec=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
const canSpeak="speechSynthesis" in window;
const LANGS=[["en-GB","British English"],["en-US","American English"],["en-IN","Indian / South Asian English"],["en-AU","Australian English"]];

/* ---------- state ---------- */
const S={view:"home",sel:"b1",custom:[],history:[],session:null,typing:false,edit:null,fb:{},models:{},delAsk:null,audio:{},setOpen:false,starting:false,
  settings:{voice:true,voiceURI:"",lang:"en-GB",key:"",model:"claude-sonnet-5-5"}};
let T=null;                 // the running test
const LS="ielts-room-v1", LSS="ielts-room-settings";

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const words=t=>(t||"").trim().split(/\s+/).filter(Boolean).length;
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch{return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const allSets=()=>[...BUILTIN,...S.custom];
const findSet=id=>allSets().find(s=>s.id===id);
const p1count=s=>(s.part1||[]).reduce((n,t)=>n+t.questions.length,0);
const hasCue=s=>!!(s.cue&&s.cue.topic);
const hasKey=()=>!!(S.settings.key||"").trim();
const lowerFirst=s=>s?s[0].toLowerCase()+s.slice(1):s;

/* ---------- saving: this browser only (text in localStorage, recordings in IndexedDB) ---------- */
function loadLocal(){const d=lsGet(LS)||{};S.custom=d.custom||[];S.history=d.history||[]}
function save(){while(S.history.length>40)dropAudio(S.history.pop());lsSet(LS,{custom:S.custom,history:S.history})}
let idbP=null;
function idb(){
  if(!idbP){idbP=new Promise((res,rej)=>{try{const r=indexedDB.open("ielts-room",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("audio");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});idbP.catch(()=>{})}
  return idbP;
}
async function audioPut(k,b){try{const d=await idb();await new Promise((res,rej)=>{const tx=d.transaction("audio","readwrite");tx.objectStore("audio").put(b,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch{}}
async function audioGet(k){try{const d=await idb();return await new Promise(res=>{const rq=d.transaction("audio").objectStore("audio").get(k);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null)})}catch{return null}}
async function audioDel(k){try{const d=await idb();d.transaction("audio","readwrite").objectStore("audio").delete(k)}catch{}}
function dropAudio(h){(h&&h.audio||[]).forEach(i=>audioDel(h.id+":"+i))}
function clearAudio(){Object.values(S.audio).forEach(u=>{try{URL.revokeObjectURL(u)}catch{}});S.audio={}}

/* ---------- microphone, recorder, speech-to-text ---------- */
let micStream=null,micDenied=false;
async function getMic(){
  if(micStream||!canRec||micDenied)return micStream;
  try{micStream=await navigator.mediaDevices.getUserMedia({audio:true})}catch{micDenied=true;micStream=null}
  return micStream;
}
function releaseMic(){try{micStream&&micStream.getTracks().forEach(t=>t.stop())}catch{}micStream=null}
function recStart(){
  T.rec=null;T.chunks=[];if(!micStream)return;
  try{const r=new MediaRecorder(micStream),chunks=T.chunks;r.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};r.start();T.rec=r}catch{T.rec=null}
}
function recStop(){
  return new Promise(res=>{
    const r=T&&T.rec,chunks=T&&T.chunks;if(!r||r.state==="inactive"){res(null);return}
    T.rec=null;
    r.onstop=()=>res(chunks.length?new Blob(chunks,{type:r.mimeType||"audio/webm"}):null);
    try{r.stop()}catch{res(null)}
    setTimeout(()=>res(null),3000);
  });
}
function srStart(){
  T.sr=null;T.srDead=false;T.srRestarts=0;
  if(!SR||S.typing)return false;
  try{
    const r=new SR();r.lang=S.settings.lang||"en-GB";r.continuous=true;r.interimResults=true;
    r.onresult=e=>{
      if(!T||T.sr!==r)return;let interim="";
      for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];
        if(x.isFinal){const t=x[0].transcript.trim();if(t)T.finals.push(t)}else interim+=x[0].transcript}
      T.partial=interim.trim();paintLive();
    };
    r.onerror=e=>{
      if(!T||T.sr!==r)return;
      if(["not-allowed","service-not-allowed","audio-capture","network"].includes(e.error)){
        T.srDead=true;S.typing=true;
        T.msg=e.error==="network"?"Speech-to-text needs an internet connection and could not connect. Type your answers for now."
                                 :"Speech-to-text could not use the microphone, so type your answers instead. Check the microphone permission in your browser's address bar.";
        if(T.phase==="answering"){render();const t=$("#typed");if(t)t.focus()}
      }
    };
    r.onend=()=>{
      if(!T||T.sr!==r)return;
      if(T.phase==="answering"&&!T.srDead&&T.srRestarts<40){
        if(T.partial){T.finals.push(T.partial);T.partial=""}
        T.srRestarts++;try{r.start();return}catch{}
      }
      if(T.srWait){const w=T.srWait;T.srWait=null;w()}
    };
    r.start();T.sr=r;return true;
  }catch{T.sr=null;return false}
}
function srStop(){
  return new Promise(res=>{
    const r=T&&T.sr;if(!r){res();return}
    T.srWait=res;try{r.stop()}catch{T.srWait=null;res()}
    setTimeout(res,2500);
  });
}

/* ---------- examiner voice (the browser's own speech) ---------- */
let voices=[],speakSeq=0,keep=[];
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}catch{voices=[]}}
function pickVoice(){
  return voices.find(v=>v.voiceURI===S.settings.voiceURI)||voices.find(v=>/en[-_]GB/i.test(v.lang)&&/google|female|natural/i.test(v.name))||
         voices.find(v=>/en[-_]GB/i.test(v.lang))||voices[0]||null;
}
function setSpeaking(b){if(!T)return;T.speaking=b;paintStatus()}
function stopSpeaking(){speakSeq++;try{canSpeak&&speechSynthesis.cancel()}catch{}setSpeaking(false)}
function speak(text){
  if(!S.settings.voice||!canSpeak||!text)return Promise.resolve();
  const my=++speakSeq;
  return new Promise(res=>{
    let done=false;const fin=()=>{if(done)return;done=true;if(my===speakSeq)setSpeaking(false);res()};
    try{
      speechSynthesis.cancel();keep=[];
      const parts=(text.match(/[^.?!]+[.?!]*\s*/g)||[text]).map(p=>p.trim()).filter(Boolean),v=pickVoice();
      setSpeaking(true);
      parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p);if(v){u.voice=v;u.lang=v.lang}else u.lang="en-GB";u.rate=.95;
        u.onerror=fin;if(i===parts.length-1)u.onend=fin;keep.push(u);speechSynthesis.speak(u)});
    }catch{fin()}
  });
}
const speakBounded=text=>Promise.race([speak(text),sleep(4000+words(text)*520)]);

/* ---------- test flow ---------- */
function buildSteps(set){
  const steps=[];
  (set.part1||[]).forEach(t=>t.questions.forEach((q,j)=>{
    let pre="";
    if(!steps.length)pre="Let's begin with Part 1. I'd like to ask you some questions about yourself. "+(t.topic?"Let's talk about "+lowerFirst(t.topic)+". ":"");
    else if(j===0&&t.topic)pre="Now let's talk about "+lowerFirst(t.topic)+". ";
    steps.push({type:"q",part:1,topic:t.topic||"",text:q,say:pre+q});
  }));
  if(hasCue(set)){
    const b=(set.cue.bullets||[]);
    steps.push({type:"cue",part:2,text:set.cue.topic,bullets:b,
      say:"Now, Part 2. I'm going to give you a topic, and I'd like you to talk about it for one to two minutes. Before you talk, you have one minute to think about what you are going to say. You can make some notes if you wish. Here is your topic. "+set.cue.topic+(b.length?" You should say: "+b.join("; ")+".":"")});
  }
  (set.part3||[]).forEach((q,i)=>{
    const pre=i===0?(hasCue(set)?"We've been talking about "+(set.theme||"your topic")+", and I'd like to discuss one or two more general questions related to this. ":"Now, Part 3. I'd like to discuss some more general questions with you. "):"";
    steps.push({type:"q",part:3,topic:"",text:q,say:pre+q});
  });
  [1,2,3].forEach(p=>{const g=steps.filter(s=>s.part===p);g.forEach((s,i)=>{s.n=i+1;s.of=g.length})});
  return steps;
}
const cur=()=>T&&T.steps[T.idx];
const TIMING={1:{max:45,lo:15,hi:30,hint:"Part 1 answers are short: two or three sentences, about 15 to 30 seconds."},
              2:{max:120,lo:60,hi:120,hint:"Keep going until the examiner stops you at 2:00. Stopping before 1:00 costs fluency marks."},
              3:{max:90,lo:30,hi:60,hint:"Part 3 wants developed answers: give an opinion, a reason and an example, about 30 to 60 seconds."}};

async function startTest(){                 // called from a click
  const set=findSet(S.sel);if(!set||S.starting)return;
  const steps=buildSteps(set);if(!steps.length)return;
  S.starting=true;
  try{if(canSpeak&&S.settings.voice)speechSynthesis.speak(new SpeechSynthesisUtterance(" "))}catch{}   // unlock speech inside the click
  await getMic();
  S.starting=false;
  if(micDenied&&!micStream)S.typing=true;
  T={set,steps,idx:0,start:Date.now(),answers:[],blobs:[],notes:"",phase:"",flow:0,finals:[],partial:"",t0:null,speaking:false,
     msg:micDenied?"The microphone is blocked, so nothing is recorded and you type your answers. Allow the microphone in your browser's address bar and start again to speak.":"",endAsk:false,sr:null,rec:null,chunks:[]};
  S.view="test";enterStep(true);window.scrollTo(0,0);
}
function enterStep(keepMsg){
  const st=cur();T.finals=[];T.partial="";T.t0=null;if(!keepMsg)T.msg="";
  const id=++T.flow;
  if(st.type==="q"){T.phase="asking";render();speakBounded(st.say).then(()=>{if(T&&id===T.flow&&T.phase==="asking"){T.phase="ready";render()}})}
  else{T.phase="intro";render();speakBounded(st.say).then(()=>{if(T&&id===T.flow&&T.phase==="intro")startPrep()})}
}
function startPrep(){T.flow++;T.phase="prep";T.prepEnd=Date.now()+60000;render();const n=$("#notes");if(n)n.focus()}
function endPrep(){
  if(!T||T.phase!=="prep")return;keepNotes();T.flow++;T.phase="ready";render();
  speak("All right? Remember, you have one to two minutes for this, so don't worry if I stop you. I'll tell you when the time is up. Can you start speaking now, please?");
}
function keepNotes(){const n=$("#notes");if(n)T.notes=n.value}
function startAnswer(){               // called straight from a click or key press
  const st=cur();if(!st||!["asking","ready","prep"].includes(T.phase))return;
  keepNotes();T.flow++;stopSpeaking();
  T.finals=[];T.partial="";T.msg="";T.phase="answering";
  recStart();srStart();
  T.t0=Date.now();render();
  const t=$("#typed");if(t)t.focus();
}
function collectText(){
  const typed=$("#typed"),speech=[...T.finals,T.partial].filter(Boolean).join(" ").trim();
  return typed?(typed.value.trim()||speech):speech;
}
async function finishAnswer(){
  if(!T||T.phase!=="answering")return;
  T.phase="stopping";const id=++T.flow,st=cur(),idx=T.idx;
  const secs=Math.round((Date.now()-T.t0)/1000),typedNow=$("#typed")?$("#typed").value.trim():null;
  paintControls();
  const [,blob]=await Promise.all([srStop(),recStop()]);
  if(!T||id!==T.flow)return;
  const speech=[...T.finals,T.partial].filter(Boolean).join(" ").trim();
  T.answers[idx]={text:typedNow!==null?(typedNow||speech):speech,secs};T.blobs[idx]=blob;T.sr=null;
  if(st.type==="cue")await speakBounded("Thank you.");
  if(!T||id!==T.flow)return;
  nextStep();
}
function nextStep(){T.idx++;if(T.idx>=T.steps.length)finishTest();else{enterStep();window.scrollTo(0,0)}}
function skipStep(){if(!T||["answering","stopping","ended"].includes(T.phase))return;stopSpeaking();T.answers[T.idx]={text:"",secs:0};T.flow++;nextStep()}
async function endTest(){
  if(!T||T.phase==="ended")return;T.flow++;stopSpeaking();
  if(T.phase==="answering"){
    const idx=T.idx,secs=Math.round((Date.now()-T.t0)/1000),typedNow=$("#typed")?$("#typed").value.trim():null;
    T.phase="ended";
    const [,blob]=await Promise.all([srStop(),recStop()]);
    const speech=[...T.finals,T.partial].filter(Boolean).join(" ").trim();
    T.answers[idx]={text:typedNow!==null?(typedNow||speech):speech,secs};T.blobs[idx]=blob;
  }
  T.phase="ended";finishTest();
}
function finishTest(){
  const n=Math.max(T.idx,T.answers.length);
  const items=T.steps.slice(0,n).map((st,i)=>{const a=T.answers[i]||{text:"",secs:0};
    return{part:st.part,q:st.type==="cue"?st.text+(st.bullets.length?" You should say: "+st.bullets.join("; ")+".":""):st.text,text:a.text||"",secs:a.secs||0}});
  const blobs=T.blobs,any=items.some(it=>it.text)||blobs.some(Boolean);
  const ses={id:newId("t"),at:Date.now(),setId:T.set.id,setName:T.set.name,total:Math.round((Date.now()-T.start)/1000),items,feedback:null,audio:[]};
  releaseMic();T=null;
  if(!any){S.view="home";render();return}
  clearAudio();
  blobs.forEach((b,i)=>{if(b&&i<items.length){S.audio[i]=URL.createObjectURL(b);ses.audio.push(i);audioPut(ses.id+":"+i,b)}});
  S.session=ses;S.fb={};S.models={};S.history.unshift(ses);save();
  S.view="results";render();window.scrollTo(0,0);
}
async function openSession(h){
  clearAudio();S.session=h;S.fb=h.feedback?{state:"done"}:{};S.models={};S.view="results";render();window.scrollTo(0,0);
  let got=false;
  for(const i of (h.audio||[])){const b=await audioGet(h.id+":"+i);if(b&&S.session===h){S.audio[i]=URL.createObjectURL(b);got=true}}
  if(got&&S.session===h&&S.view==="results")render();
}

/* ---------- painting small parts of the test room without a full render ---------- */
function tick(){
  if(S.view!=="test"||!T)return;
  const c=$("#clock");if(c)c.textContent=fmt((Date.now()-T.start)/1000);
  if(T.phase==="prep"){const left=(T.prepEnd-Date.now())/1000;const p=$("#prep-time");if(p)p.textContent=fmt(Math.ceil(left));if(left<=0)endPrep()}
  if(T.phase==="answering"&&T.t0){
    const st=cur(),tm=TIMING[st.part],el=(Date.now()-T.t0)/1000;
    const a=$("#ans-time");if(a)a.textContent=st.type==="cue"?fmt(Math.ceil(120-el)):fmt(el);
    const f=$("#fill"),m=$("#meter");
    if(f)f.style.width=Math.min(100,el/tm.max*100)+"%";
    if(m)m.className="meter"+(el>=tm.lo&&el<=tm.hi?" in":el>tm.hi?" over":"");
    if(st.type==="cue"&&el>=120)finishAnswer();
  }
}
function paintLive(){
  const f=$("#live-final"),p=$("#live-partial"),ph=$("#live-ph"),box=$("#live");if(!f||!T)return;
  f.textContent=T.finals.join(" ")+(T.finals.length?" ":"");p.textContent=T.partial;
  if(ph)ph.hidden=!!(T.finals.length||T.partial);
  if(box)box.scrollTop=box.scrollHeight;
}
function paintStatus(){
  const el=$("#status");if(!el||!T)return;
  const sp=T.speaking;el.className="status"+(sp?" speaking":"");
  const txt={asking:sp?"Examiner is speaking":"Your turn",intro:sp?"Examiner is giving the instructions":"Read your task card",
    prep:"Preparation time. Make notes if you like.",ready:sp?"Examiner is speaking":"Your turn"}[T.phase]||"";
  el.innerHTML=txt?'<span class="dot"></span><span>'+esc(txt)+"</span>":"";
}
function paintRec(){
  const r=$("#rec");if(!r||!T)return;
  const listening=!!T.sr&&!$("#typed"),recording=!!T.rec;
  r.className="rec"+(listening||recording?"":" wait");
  r.innerHTML='<span class="dot"></span>'+(listening?(recording?"Listening and recording":"Listening"):recording?"Recording your voice":"Clock running");
}
function paintControls(){const c=$("#controls");if(c)c.innerHTML=controlsHTML()}

/* ---------- views ---------- */
function render(){
  const app=$("#app");
  app.className="wrap"+(S.view==="home"?"":" narrow");
  app.innerHTML=S.view==="home"?homeHTML():S.view==="edit"?editHTML():S.view==="test"?testHTML():resultsHTML();
  if(S.view==="test"){paintStatus();paintRec();paintLive();tick()}
}
const capLine=(ok,a,b)=>'<li><span class="dot '+(ok?"ok":"warn")+'"></span><span>'+(ok?a:b)+"</span></li>";
function settingsHTML(){
  const st=S.settings;
  return'<details class="settings" id="settings"'+(S.setOpen?" open":"")+'><summary>Settings</summary><div class="setgrid">'+
  (voices.length?'<div class="field"><label for="opt-voicename">Examiner voice</label><select id="opt-voicename"><option value="">Automatic (British if this device has one)</option>'+
    voices.map(v=>'<option value="'+esc(v.voiceURI)+'"'+(v.voiceURI===st.voiceURI?" selected":"")+">"+esc(v.name+" ("+v.lang+")")+"</option>").join("")+"</select></div>":"")+
  (SR?'<div class="field"><label for="opt-lang">Speech-to-text listens for</label><select id="opt-lang">'+LANGS.map(([c,n])=>'<option value="'+c+'"'+(c===st.lang?" selected":"")+">"+n+"</option>").join("")+
    '</select><span class="hint">Pick the one closest to how you speak. If the transcript keeps mishearing you, try another.</span></div>':"")+
  '<div class="field"><label for="opt-key">Anthropic API key <span class="muted" style="font-weight:400">(optional)</span></label><input type="password" id="opt-key" autocomplete="off" spellcheck="false" placeholder="sk-ant-…" value="'+esc(st.key)+'">'+
    '<span class="hint">Turns on band feedback, model answers and drafted sets. It stays in this browser and goes only to Anthropic. Never put it in your GitHub repository.</span></div>'+
  '<div class="field"><label for="opt-model">Model for feedback</label><input type="text" id="opt-model" spellcheck="false" value="'+esc(st.model)+'"></div>'+
  "</div></details>";
}
function homeHTML(){
  const set=findSet(S.sel)||BUILTIN[0];
  const topics=(set.part1||[]).map(t=>t.topic).filter(Boolean);
  const setBtn=s=>'<button class="set" data-act="pick" data-id="'+esc(s.id)+'" aria-pressed="'+(s.id===set.id)+'"><b>'+esc(s.name)+'</b>'+
    (s.builtin?"":'<span class="tag mine">Yours</span>')+
    '<span class="meta">'+p1count(s)+" Part 1 questions · "+(hasCue(s)?"task card":"no task card")+" · "+(s.part3||[]).length+" Part 3 questions</span></button>";
  const hist=S.history.length?'<div class="rows">'+S.history.map(h=>{
      const fb=h.feedback,n=h.items.filter(i=>i.text).length;
      return'<div class="row"><span class="when num">'+esc(new Date(h.at).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}))+'</span>'+
      '<button class="open" data-act="open" data-id="'+esc(h.id)+'">'+esc(h.setName)+' <span class="muted small">· '+n+" answers · "+fmt(h.total||0)+"</span></button>"+
      (fb?'<span class="pill">Band '+esc(fb.overall.toFixed(1))+"</span>":'<span class="pill none">No feedback yet</span>')+
      '<button class="btn quiet small" data-act="del-session" data-id="'+esc(h.id)+'">'+(S.delAsk===h.id?"Really delete?":"Delete")+"</button></div>"}).join("")+"</div>"
    :'<p class="empty">Your finished tests appear here with their recordings, transcripts and band estimates.</p>';
  return'<header class="mast"><p class="eyebrow">IELTS Speaking · full mock test</p><h1>Speaking <i>Room</i></h1>'+
  '<p class="lede">The examiner asks, you answer out loud, the clock runs. Three parts in 11 to 14 minutes, the same shape as test day.</p></header>'+
  '<div class="home-grid"><section class="sheet start"><div><p class="eyebrow">Selected set</p><h2>'+esc(set.name)+"</h2>"+
  (topics.length?'<p class="muted small">Part 1 opens with '+esc(topics.map(lowerFirst).join(", "))+". Parts 2 and 3 stay hidden until you reach them.</p>":"")+"</div>"+
  '<ol class="plan"><li><b>Part 1</b><span class="num">4–5 min</span><span>'+p1count(set)+' interview questions</span></li>'+
  '<li><b>Part 2</b><span class="num">1 + 2 min</span><span>'+(hasCue(set)?"Task card, prepare then speak":"Not in this set")+'</span></li>'+
  '<li><b>Part 3</b><span class="num">4–5 min</span><span>'+(set.part3||[]).length+" discussion questions</span></li></ol>"+
  '<div class="actions"><button class="btn primary big" data-act="start">Start the test</button><button class="btn quiet" data-act="random">Pick a set for me</button></div>'+
  '<div class="opts"><label><input type="checkbox" id="opt-voice" '+(S.settings.voice?"checked":"")+(canSpeak?"":" disabled")+"> Examiner reads questions aloud</label></div>"+
  '<ul class="check">'+
  capLine(!!SR,"Live transcript is ready. Allow the microphone when the test starts.","This browser has no speech-to-text, so you type your answers. Use Chrome or Edge for a live transcript.")+
  capLine(canRec,"Each answer is recorded so you can listen back afterwards.","This browser cannot record audio.")+
  capLine(canSpeak,"Examiner voice is ready.","This browser cannot read questions aloud. They still appear on screen.")+
  capLine(hasKey(),"AI band feedback is on, using your API key.","AI band feedback is off. Add an API key in Settings, or copy your finished test into Claude.")+
  '<li><span class="dot"></span><span>Sets, past tests and recordings are saved in this browser only.</span></li>'+
  "</ul>"+settingsHTML()+"</section>"+
  '<section class="sets"><div class="sec-head"><h2>Question sets</h2><button class="btn" data-act="new-set">Write your own set</button></div>'+
  (S.custom.length?'<p class="sublabel">Yours</p><div class="setlist">'+S.custom.map(s=>setBtn(s)).join("")+'</div><p><button class="btn quiet small" data-act="edit-set">Edit the selected set</button></p><p class="sublabel">Built in</p>':"")+
  '<div class="setlist">'+BUILTIN.map(setBtn).join("")+"</div></section></div>"+
  '<section class="history"><div class="sec-head"><h2>Past tests</h2></div>'+hist+"</section>";
}
function editHTML(){
  const e=S.edit;

/* ---------- AI feedback with the user's own Anthropic API key ---------- */
async function ask(prompt,maxTokens){
  let r;
  try{r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
    headers:{"content-type":"application/json","x-api-key":S.settings.key.trim(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:(S.settings.model||"").trim()||"claude-sonnet-5-5",max_tokens:maxTokens,messages:[{role:"user",content:prompt}]})})}
  catch{throw{code:"network"}}
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw{code:r.status===401||r.status===403?"bad_key":r.status===404?"bad_model":r.status===429||r.status===529?"rate_limited":"api",message:j&&j.error&&j.error.message};
  return((j&&j.content)||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
}
function errText(e,fallback){
  const c=e&&e.code;
  return c==="bad_key"?"Anthropic rejected the API key. Check it in Settings on the home screen."
    :c==="bad_model"?"Anthropic does not know the model name in Settings. Change it on the home screen."
    :c==="rate_limited"?"Anthropic is busy or your key hit its limit. Wait a minute, then try again."
    :c==="network"?"Could not reach Anthropic. Check your internet connection and try again."
    :c==="api"&&e.message?"Anthropic returned an error: "+e.message:fallback;
}
function parseJSON(t){const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<=a)throw new Error("no json");return JSON.parse(t.slice(a,b+1))}
const band=x=>{x=Number(x);if(!isFinite(x))x=0;return Math.min(9,Math.max(0,Math.round(x*2)/2))};
const strs=(a,n)=>(Array.isArray(a)?a:[]).filter(x=>typeof x==="string"&&x.trim()).slice(0,n);
const EXAMINER="You are an experienced IELTS Speaking examiner giving feedback on a mock test. You only have transcripts made by speech recognition, with the seconds each answer lasted.\n"+
  "Rules:\n- Score with the public IELTS Speaking band descriptors for Fluency and Coherence, Lexical Resource, and Grammatical Range and Accuracy. Bands are 0 to 9 in steps of 0.5. Be accurate and do not inflate: most learners sit between 5 and 7.\n"+
  "- Do not score pronunciation. Ignore punctuation, capitalisation and words that look like recognition mistakes (wrong homophones, odd names).\n"+
  "- Judge length against the task: Part 1 answers should be about 15-30 seconds, Part 2 about 2 minutes, Part 3 about 30-60 seconds.\n"+
  "- Write to the candidate as 'you', in plain English an intermediate learner can follow. Quote their own words when you correct them.\n";
const testData=ses=>ses.items.map((it,i)=>({n:i+1,part:it.part,question:it.q,seconds:it.secs,words:words(it.text),answer:it.text.slice(0,2600)})).filter(d=>d.words>=3);
async function getFeedback(){
  const ses=S.session;if(!hasKey()||!ses||S.fb.state==="loading")return;
  const data=testData(ses);
  if(!data.length){S.fb={err:"There is not enough transcribed speech in this test to assess. Answer at least one question in a full sentence."};render();return}
  S.fb={state:"loading"};render();
  const prompt=EXAMINER+"Return ONLY a JSON object, no markdown, in exactly this shape:\n"+
  '{"fluency":{"band":6.0,"comment":"one or two sentences"},"lexical":{"band":6.0,"comment":"..."},"grammar":{"band":6.0,"comment":"..."},'+
  '"strengths":["up to 3 specific things done well"],"priorities":["up to 3 specific things to practise next, most important first"],'+
  '"answers":[{"n":1,"comment":"one sentence on this answer","fixes":[{"said":"their exact phrase","better":"corrected or more natural phrase","why":"a few words"}],"upgrade":"their own answer rewritten one band higher, keeping their ideas"}]}\n'+
  "Give one entry in answers for every answer below, with at most 2 fixes each. Keep each upgrade under 60 words for Parts 1 and 3 and under 130 words for Part 2. For a Part 1 answer that is already good, set upgrade to an empty string.\n\n"+
  "The test:\n"+JSON.stringify(data);
  try{
    const j=parseJSON(await ask(prompt,8000));
    const c=k=>({band:band(j[k]&&j[k].band),comment:String((j[k]&&j[k].comment)||"")});
    const fb={fluency:c("fluency"),lexical:c("lexical"),grammar:c("grammar"),strengths:strs(j.strengths,3),priorities:strs(j.priorities,3),
      answers:(Array.isArray(j.answers)?j.answers:[]).map(a=>({n:Number(a.n),comment:String(a.comment||""),upgrade:String(a.upgrade||""),
        fixes:(Array.isArray(a.fixes)?a.fixes:[]).slice(0,2).map(f=>({said:String(f.said||""),better:String(f.better||""),why:String(f.why||"")})).filter(f=>f.said&&f.better)}))};
    fb.overall=Math.floor((fb.fluency.band+fb.lexical.band+fb.grammar.band)/3*2)/2;
    ses.feedback=fb;S.fb={state:"done"};save();
  }catch(e){S.fb={err:errText(e,"The feedback did not come back in a form this page could read. Try again.")}}
  if(S.view==="results"&&S.session===ses)render();
}
async function getModel(i){
  const ses=S.session,it=ses&&ses.items[i];if(!hasKey()||!it||S.models[i])return;
  S.models[i]={state:"loading",text:""};render();
  const len=it.part===2?"about 230 words, enough for two minutes":it.part===1?"40 to 60 words":"80 to 110 words";
  const prompt="Write a band 8 IELTS Speaking Part "+it.part+" answer to this examiner prompt. Natural spoken English with contractions, "+len+", no headings and no markdown. Then leave a blank line and write 'Useful language:' followed by four phrases from your answer worth learning, separated by commas.\n\nPrompt: "+it.q;
  try{S.models[i]={state:"done",text:await ask(prompt,900)}}
  catch(e){S.models[i]={state:"err",text:errText(e,"The model answer could not be written. Try again later.")};
    setTimeout(()=>{if(S.models[i]&&S.models[i].state==="err"){delete S.models[i];if(S.view==="results")render()}},5000)}
  if(S.view==="results"&&S.session===ses)render();
}
function promptForClaude(ses){
  return"Act as an experienced IELTS Speaking examiner. Below is my mock speaking test, transcribed by speech recognition, with how long each answer lasted. "+
   "Ignore punctuation and words that look like recognition mistakes, and do not score pronunciation.\n\nPlease give me:\n"+
   "1. An estimated band (0-9, in 0.5 steps) for Fluency and Coherence, Lexical Resource, and Grammatical Range and Accuracy, with a sentence on each. Be accurate, do not inflate.\n"+
   "2. Three things I did well and three things to practise next.\n"+

}

/* ---------- custom sets ---------- */
function toEdit(s){return{id:s?s.id:null,name:s?s.name:"",theme:s?s.theme||"":"",
  p1:s?(s.part1||[]).map(t=>(t.topic?"# "+t.topic+"\n":"")+t.questions.join("\n")).join("\n"):"",
  cue:s&&hasCue(s)?[s.cue.topic,...(s.cue.bullets||[])].join("\n"):"",p3:s?(s.part3||[]).join("\n"):"",err:"",aiTopic:"",busy:false}}
function readEdit(){const e=S.edit;if(!e)return;const v=id=>{const el=$("#"+id);return el?el.value:""};
  e.name=v("ed-name");e.p1=v("ed-p1");e.cue=v("ed-cue");e.theme=v("ed-theme");e.p3=v("ed-p3");const a=$("#ai-topic");if(a)e.aiTopic=a.value}
function fromEdit(e){
  const lines=t=>t.split("\n").map(x=>x.trim()).filter(Boolean);
  const part1=[];let cur1=null;
  lines(e.p1).forEach(l=>{if(l.startsWith("#")){cur1={topic:l.replace(/^#+\s*/,""),questions:[]};part1.push(cur1)}
    else{if(!cur1){cur1={topic:"",questions:[]};part1.push(cur1)}cur1.questions.push(l)}});
  const cl=lines(e.cue).map(l=>l.replace(/^[-•*]\s*/,""));
  return{id:e.id||newId("c"),name:e.name.trim(),theme:e.theme.trim(),part1:part1.filter(t=>t.questions.length),
    cue:cl.length?{topic:cl[0],bullets:cl.slice(1)}:null,part3:lines(e.p3),at:Date.now()};
}
function saveSet(){
  readEdit();const e=S.edit,s=fromEdit(e);
  if(!s.name){e.err="Give the set a name so you can find it later.";render();return}
  if(!s.part1.length&&!s.cue&&!s.part3.length){e.err="Add at least one question or a task card.";render();return}
  const i=S.custom.findIndex(x=>x.id===s.id);if(i>=0)S.custom[i]=s;else S.custom.unshift(s);
  S.sel=s.id;S.edit=null;S.view="home";save();render();
}
async function aiDraft(){
  readEdit();const e=S.edit,topic=(e.aiTopic||"").trim();
  if(!hasKey()||e.busy)return;
  if(!topic){e.err="Type a topic first, then draft.";render();return}
  e.busy=true;e.err="";render();
  const prompt="Write one original IELTS Speaking practice test on the topic below, in the style and difficulty of the real exam. Return ONLY JSON, no markdown, in this shape:\n"+
   '{"name":"short set name, 3 to 5 words","part1":[{"topic":"short everyday topic","questions":["q1","q2","q3"]}],"cue":{"topic":"Describe ...","bullets":["...","...","...","and explain ..."]},"theme":"noun phrase that completes: We have been talking about ...","part3":["q1","q2","q3","q4","q5"]}\n'+
   "Part 1: three everyday topics with three short personal questions each; the first topic is general (home, work or study) and the others relate loosely to the main topic. Part 2: one task card with four points. Part 3: five abstract discussion questions linked to the task card.\n\nTopic: "+topic.slice(0,200);
  try{
    const j=parseJSON(await ask(prompt,1500));
    const s={name:String(j.name||topic),theme:String(j.theme||""),
      part1:(Array.isArray(j.part1)?j.part1:[]).map(t=>({topic:String(t.topic||""),questions:strs(t.questions,6)})),
      cue:j.cue&&j.cue.topic?{topic:String(j.cue.topic),bullets:strs(j.cue.bullets,6)}:null,part3:strs(j.part3,8)};
    if(S.edit===e){const id=e.id;S.edit=toEdit(s);S.edit.id=id;S.edit.aiTopic=topic}
  }catch(err){if(S.edit===e){e.busy=false;e.err=errText(err,"The draft did not arrive. Try again, or write the questions yourself.")}}
  if(S.view==="edit")render();
}

  open:el=>{const h=S.history.find(x=>x.id===el.dataset.id);if(h)openSession(h)},
  "del-session":el=>{const id=el.dataset.id;if(S.delAsk!==id){S.delAsk=id;render();return}
     const h=S.history.find(x=>x.id===id);S.history=S.history.filter(x=>x.id!==id);S.delAsk=null;dropAudio(h);save();render()},
  answer:()=>startAnswer(),
  finish:()=>finishAnswer(),
  "skip-intro":()=>{if(T&&T.phase==="intro"){stopSpeaking();startPrep()}},
  repeat:()=>{const st=cur();if(st&&["asking","ready"].includes(T.phase))speak(st.text)},
  skip:()=>skipStep(),
  "type-toggle":()=>{keepNotes();S.typing=!S.typing;T.msg="";render()},
  end:()=>{T.endAsk=true;paintControls()},
  "end-no":()=>{T.endAsk=false;paintControls()},
  "end-yes":()=>endTest(),
  feedback:()=>getFeedback(),
  "save-key":()=>{const el=$("#key-inline"),v=el?el.value.trim():"";if(!v)return;S.settings.key=v;saveSettings();S.fb={};render()},
  model:el=>getModel(Number(el.dataset.i)),
  again:()=>{if(findSet(S.session.setId)){S.sel=S.session.setId;clearAudio();startTest()}else{S.view="home";render()}},
  copy:el=>{const s=S.session;copyTo(el,s.setName+"\n\n"+s.items.map(i=>"Part "+i.part+" · "+i.q+"\n"+(i.text||"(no transcript)")).join("\n\n"),"Copy transcript")},
  "copy-prompt":el=>{if(!S.session.items.some(i=>i.text)){el.textContent="There is no transcript to copy";return}copyTo(el,promptForClaude(S.session),"Copy my test for Claude")}
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f)f(el)});
document.addEventListener("change",e=>{
  const id=e.target.id,st=S.settings;
  if(id==="opt-voice")st.voice=e.target.checked;
  else if(id==="opt-voicename")st.voiceURI=e.target.value;
  else if(id==="opt-lang")st.lang=e.target.value;
  else if(id==="opt-model")st.model=e.target.value.trim();
  else if(id==="opt-key"){st.key=e.target.value.trim();saveSettings();render();return}
  else return;
  saveSettings();
});
document.addEventListener("toggle",e=>{if(e.target&&e.target.id==="settings")S.setOpen=e.target.open},true);
document.addEventListener("keydown",e=>{
  if(S.view!=="test"||!T||e.code!=="Space"||e.repeat)return;
  if(e.target.closest&&e.target.closest("button,textarea,input,select,a"))return;
  e.preventDefault();
  if(T.phase==="answering")finishAnswer();else startAnswer();
});
window.addEventListener("pagehide",()=>{releaseMic();try{canSpeak&&speechSynthesis.cancel()}catch{}});
setInterval(tick,200);

/* ---------- boot ---------- */
(function boot(){
  const st=lsGet(LSS);if(st&&typeof st==="object")Object.assign(S.settings,st);
  loadLocal();if(!findSet(S.sel))S.sel="b1";
  if(canSpeak){loadVoices();try{speechSynthesis.onvoiceschanged=()=>{loadVoices();
    const a=document.activeElement;if(S.view==="home"&&!(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)))render()}}catch{}}
  render();
})();
</script>
</body>
</html>
